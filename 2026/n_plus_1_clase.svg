<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Diagramă: interogările din jurnal sunt grupate după text, apoi după numărul de repetări; clasa [1] se ignoră, clasele [2], [3]… merită atenție, iar clasele cu zeci de repetări sunt candidate N+1.">
<style><![CDATA[
@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap");
text{font-family:"Archivo",system-ui,"Segoe UI",Roboto,sans-serif;fill:#14202e}
.m{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.mut{fill:#5b6978}
]]></style>
<rect width="1600" height="900" fill="#eceff3"/>
<text x="60" y="68" font-size="32" font-weight="800" letter-spacing="-0.5">Problema N+1: din mii de interogări, câteva clase</text>
<text x="60" y="104" font-size="18" class="mut">„Am un N+1 undeva în aplicație?” Greu de văzut direct în jurnalul bazei de date. Le împărțim în clase după numărul de repetări.</text>
<text x="60" y="168" font-size="14" font-weight="600" letter-spacing="1.2" class="mut">1 · JURNALUL BAZEI DE DATE</text>
<text x="600" y="168" font-size="14" font-weight="600" letter-spacing="1.2" class="mut">2 · ACELAȘI QUERY, UN SINGUR GRUP</text>
<text x="1120" y="168" font-size="14" font-weight="600" letter-spacing="1.2" class="mut">3 · CLASE DUPĂ NUMĂRUL DE REPETĂRI</text>
<rect x="60" y="190" width="460" height="565" rx="6" fill="#f8f9fb" stroke="#cdd5de" stroke-width="1.5"/>
<rect x="76" y="208" width="4" height="20" rx="1" fill="#8794a3"/>
<text x="92" y="222" font-size="14" class="m">SELECT * FROM users WHERE id = 7</text>
<rect x="76" y="236.6" width="4" height="20" rx="1" fill="#c62d2d"/>
<text x="92" y="250.6" font-size="14" class="m">SELECT * FROM orders WHERE user_id = 1</text>
<rect x="76" y="265.2" width="4" height="20" rx="1" fill="#c62d2d"/>
<text x="92" y="279.2" font-size="14" class="m">SELECT * FROM orders WHERE user_id = 2</text>
<rect x="76" y="293.8" width="4" height="20" rx="1" fill="#c62d2d"/>
<text x="92" y="307.8" font-size="14" class="m">SELECT * FROM orders WHERE user_id = 3</text>
<rect x="76" y="322.40000000000003" width="4" height="20" rx="1" fill="#8794a3"/>
<text x="92" y="336.40000000000003" font-size="14" class="m">SELECT * FROM roles</text>
<rect x="76" y="351.00000000000006" width="4" height="20" rx="1" fill="#c62d2d"/>
<text x="92" y="365.00000000000006" font-size="14" class="m">SELECT * FROM orders WHERE user_id = 4</text>
<rect x="76" y="379.6000000000001" width="4" height="20" rx="1" fill="#e0930a"/>
<text x="92" y="393.6000000000001" font-size="14" class="m">SELECT price FROM products WHERE id = 9</text>
<rect x="76" y="408.2000000000001" width="4" height="20" rx="1" fill="#c62d2d"/>
<text x="92" y="422.2000000000001" font-size="14" class="m">SELECT * FROM orders WHERE user_id = 5</text>
<rect x="76" y="436.8000000000001" width="4" height="20" rx="1" fill="#e0930a"/>
<text x="92" y="450.8000000000001" font-size="14" class="m">SELECT COUNT(*) FROM users</text>
<rect x="76" y="465.40000000000015" width="4" height="20" rx="1" fill="#c62d2d"/>
<text x="92" y="479.40000000000015" font-size="14" class="m">SELECT * FROM orders WHERE user_id = 6</text>
<rect x="76" y="494.00000000000017" width="4" height="20" rx="1" fill="#e0930a"/>
<text x="92" y="508.00000000000017" font-size="14" class="m">SELECT price FROM products WHERE id = 12</text>
<rect x="76" y="522.6000000000001" width="4" height="20" rx="1" fill="#c62d2d"/>
<text x="92" y="536.6000000000001" font-size="14" class="m">SELECT * FROM orders WHERE user_id = 7</text>
<rect x="76" y="551.2000000000002" width="4" height="20" rx="1" fill="#c62d2d"/>
<text x="92" y="565.2000000000002" font-size="14" class="m">SELECT * FROM orders WHERE user_id = 8</text>
<rect x="76" y="579.8000000000002" width="4" height="20" rx="1" fill="#8794a3"/>
<text x="92" y="593.8000000000002" font-size="14" class="m">UPDATE sessions SET seen = now() …</text>
<rect x="76" y="608.4000000000002" width="4" height="20" rx="1" fill="#c62d2d"/>
<text x="92" y="622.4000000000002" font-size="14" class="m">SELECT * FROM orders WHERE user_id = 9</text>
<rect x="76" y="637.0000000000002" width="4" height="20" rx="1" fill="#e0930a"/>
<text x="92" y="651.0000000000002" font-size="14" class="m">SELECT price FROM products WHERE id = 31</text>
<rect x="76" y="665.6000000000003" width="4" height="20" rx="1" fill="#e0930a"/>
<text x="92" y="679.6000000000003" font-size="14" class="m">SELECT COUNT(*) FROM users</text>
<text x="92" y="714.2000000000003" font-size="15" class="mut">… și încă mii de linii</text>
<line x1="528" y1="472" x2="583" y2="472" stroke="#12708f" stroke-width="3" stroke-linecap="round"/>
<path d="M592,472 l-12,-7 v14 z" fill="#12708f"/>
<rect x="600" y="205" width="440" height="80" rx="5" fill="#f6dcdc" stroke="#c62d2d" stroke-width="2"/>
<text x="618" y="239" font-size="14.5" class="m" font-weight="500">SELECT * FROM orders WHERE user_id = ?</text>
<text x="618" y="263" font-size="14" class="mut">valori diferite: 1, 2, 3, 4 …</text>
<text x="1022" y="241" font-size="26" font-weight="800" class="m" text-anchor="end" style="fill:#c62d2d">×47</text>
<rect x="600" y="299" width="440" height="80" rx="5" fill="#fbefd6" stroke="#e0930a" stroke-width="2"/>
<text x="618" y="333" font-size="14.5" class="m" font-weight="500">SELECT price FROM products WHERE id = ?</text>
<text x="618" y="357" font-size="14" class="mut">valori diferite: 9, 12, 31</text>
<text x="1022" y="335" font-size="26" font-weight="800" class="m" text-anchor="end" style="fill:#9a6200">×3</text>
<rect x="600" y="393" width="440" height="80" rx="5" fill="#fbefd6" stroke="#e0930a" stroke-width="2"/>
<text x="618" y="427" font-size="14.5" class="m" font-weight="500">SELECT COUNT(*) FROM users</text>
<text x="618" y="451" font-size="14" class="mut">fără parametri</text>
<text x="1022" y="429" font-size="26" font-weight="800" class="m" text-anchor="end" style="fill:#9a6200">×2</text>
<rect x="600" y="487" width="440" height="80" rx="5" fill="#f8f9fb" stroke="#cdd5de" stroke-width="2"/>
<text x="618" y="521" font-size="14.5" class="m" font-weight="500">SELECT * FROM users WHERE id = ?</text>
<text x="618" y="545" font-size="14" class="mut">valoare: 7</text>
<text x="1022" y="523" font-size="26" font-weight="800" class="m" text-anchor="end" style="fill:#5b6978">×1</text>
<rect x="600" y="581" width="440" height="80" rx="5" fill="#f8f9fb" stroke="#cdd5de" stroke-width="2"/>
<text x="618" y="615" font-size="14.5" class="m" font-weight="500">SELECT * FROM roles</text>
<text x="618" y="639" font-size="14" class="mut">fără parametri</text>
<text x="1022" y="617" font-size="26" font-weight="800" class="m" text-anchor="end" style="fill:#5b6978">×1</text>
<rect x="600" y="675" width="440" height="80" rx="5" fill="#f8f9fb" stroke="#cdd5de" stroke-width="2"/>
<text x="618" y="709" font-size="14.5" class="m" font-weight="500">UPDATE sessions SET seen = ?</text>
<text x="618" y="733" font-size="14" class="mut">valoare: now()</text>
<text x="1022" y="711" font-size="26" font-weight="800" class="m" text-anchor="end" style="fill:#5b6978">×1</text>
<g><rect x="1120" y="205" width="420" height="80" rx="5" fill="#f6dcdc" stroke="#c62d2d" stroke-width="2"/>
<text x="1140" y="249" font-size="30" font-weight="500" class="m" style="fill:#c62d2d">[≥ 10]</text>
<text x="1140" y="273" font-size="15" class="mut">repetat de zeci de ori</text>
<text x="1520" y="273" font-size="16" font-weight="800" text-anchor="end" style="fill:#c62d2d">candidat N+1</text></g>
<g><rect x="1120" y="299" width="420" height="174" rx="5" fill="#fbefd6" stroke="#e0930a" stroke-width="2"/>
<text x="1140" y="343" font-size="30" font-weight="500" class="m" style="fill:#9a6200">[2], [3] …</text>
<text x="1140" y="367" font-size="15" class="mut">repetat de câteva ori</text>
<text x="1520" y="367" font-size="16" font-weight="800" text-anchor="end" style="fill:#9a6200">merită atenția noastră</text></g>
<g opacity="0.8"><rect x="1120" y="487" width="420" height="268" rx="5" fill="#f8f9fb" stroke="#cdd5de" stroke-width="2"/>
<text x="1140" y="531" font-size="30" font-weight="500" class="m" style="fill:#5b6978">[1]</text>
<text x="1140" y="555" font-size="15" class="mut">apare o singură dată</text>
<text x="1520" y="555" font-size="16" font-weight="800" text-anchor="end" style="fill:#5b6978">ignorăm</text></g>
<text x="1140" y="417" font-size="15" class="mut">Verificăm dacă repetările vin dintr-o buclă</text>
<text x="1140" y="439" font-size="15" class="mut">peste rezultatele unui alt query.</text>
<text x="1140" y="605" font-size="15" class="mut">Majoritatea interogărilor din jurnal.</text>
<text x="1140" y="309" font-size="0"></text>
<line x1="1048" y1="245" x2="1103" y2="245" stroke="#c62d2d" stroke-width="3" stroke-linecap="round"/>
<path d="M1112,245 l-12,-7 v14 z" fill="#c62d2d"/>
<line x1="1048" y1="339" x2="1103" y2="339" stroke="#e0930a" stroke-width="3" stroke-linecap="round"/>
<path d="M1112,339 l-12,-7 v14 z" fill="#e0930a"/>
<line x1="1048" y1="433" x2="1103" y2="433" stroke="#e0930a" stroke-width="3" stroke-linecap="round"/>
<path d="M1112,433 l-12,-7 v14 z" fill="#e0930a"/>
<line x1="1048" y1="527" x2="1103" y2="527" stroke="#8794a3" stroke-width="3" stroke-linecap="round"/>
<path d="M1112,527 l-12,-7 v14 z" fill="#8794a3"/>
<line x1="1048" y1="621" x2="1103" y2="621" stroke="#8794a3" stroke-width="3" stroke-linecap="round"/>
<path d="M1112,621 l-12,-7 v14 z" fill="#8794a3"/>
<line x1="1048" y1="715" x2="1103" y2="715" stroke="#8794a3" stroke-width="3" stroke-linecap="round"/>
<path d="M1112,715 l-12,-7 v14 z" fill="#8794a3"/>
<line x1="60" y1="790" x2="1540" y2="790" stroke="#cdd5de" stroke-width="1.5"/>
<text x="60" y="828" font-size="18" font-weight="600">Notă</text>
<text x="120" y="828" font-size="18">Când unele cereri rulează mai lent decât ne așteptăm, verificăm întâi clasele de sus. N+1 se întâlnește foarte des</text>
<text x="120" y="854" font-size="18">și se repară ușor.</text>
</svg>