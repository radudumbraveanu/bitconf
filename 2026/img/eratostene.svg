<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Segoe UI, Arial, sans-serif">
<rect width="1100" height="620" fill="#fff"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#1a365d">Eratostene: Pământul măsurat cu un băț și o umbră</text>

<!-- Soare și raze paralele -->
<circle cx="1050" cy="300" r="30" fill="#f6ad55"/>
<g stroke="#cbd5e0" stroke-width="2">
<path d="M1010 120 H487"/><path d="M1010 240 H591"/><path d="M1010 360 H591"/><path d="M1010 420 H487"/>
</g>
<text x="780" y="104" font-size="18" fill="#52606d">razele Soarelui sunt paralele</text>

<!-- Pământul -->
<circle cx="400" cy="300" r="200" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="3"/>
<text x="330" y="380" font-size="22" fill="#2b6cb0" font-weight="600">Pământul</text>

<!-- Raze principale -->
<path d="M1010 300 H600" stroke="#dd6b20" stroke-width="3"/>
<path d="M600 300 H400" stroke="#dd6b20" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M1010 178 H629.6" stroke="#dd6b20" stroke-width="3"/>

<!-- Raze către centru -->
<path d="M400 300 L576.6 206.1" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 5"/>

<!-- Syene: băț fără umbră (orizontal, pe direcția razei) -->
<path d="M600 300 H660" stroke="#1a365d" stroke-width="6" stroke-linecap="round"/>
<circle cx="600" cy="300" r="6" fill="#1a365d"/>
<text x="612" y="326" font-size="20" font-weight="600" fill="#1a365d">Syene</text>
<text x="612" y="348" font-size="16" fill="#52606d">fără umbră</text>

<!-- Alexandria: băț și umbră -->
<path d="M576.6 206.1 L629.6 178" stroke="#1a365d" stroke-width="6" stroke-linecap="round"/>
<path d="M576.6 206.1 L558.5 178" stroke="#4a5568" stroke-width="6" stroke-linecap="round"/>
<circle cx="576.6" cy="206.1" r="6" fill="#1a365d"/>
<text x="650" y="210" font-size="20" font-weight="600" fill="#1a365d">Alexandria</text>
<text x="470" y="170" font-size="16" fill="#52606d">umbra</text>

<!-- Unghiuri egale -->
<path d="M460 300 A60 60 0 0 0 452.98 271.83" fill="none" stroke="#c53030" stroke-width="3"/>
<text x="468" y="288" font-size="22" font-weight="700" fill="#c53030">α</text>
<path d="M589.6 178 A40 40 0 0 0 594.3 196.8" fill="none" stroke="#c53030" stroke-width="3"/>
<text x="562" y="198" font-size="22" font-weight="700" fill="#c53030" text-anchor="end">α</text>

<!-- Distanța dintre orașe -->
<path d="M615 300 A215 215 0 0 0 589.8 199.2" fill="none" stroke="#2b6cb0" stroke-width="3"/>
<text x="640" y="266" font-size="18" fill="#2b6cb0" font-weight="600">≈ 5000 stadii</text>

<rect x="40" y="530" width="1020" height="70" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
<text x="64" y="562" font-size="22" fill="#9b2c2c" font-weight="700">α ≈ 7,2° = 1/50 dintr-un cerc, deci circumferința ≈ 50 × 5000 = 250 000 stadii</text>
<text x="64" y="587" font-size="18" fill="#742a2a">unghiul umbrei din Alexandria este egal cu unghiul dintre cele două orașe, văzut din centrul Pământului</text>
</svg>
